<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex" />
    <title>404 · Page not found</title>
    <!-- GitHub Pages serves this file with HTTP 404 for any missing URL; paths are absolute so it works at any depth. -->
    <link rel="stylesheet" href="/2024_client_MinJeong_Interaction-pages/css/basic.css" />
    <style>
      body {
        height: 100vh;
        margin: 0;
      }
      .container {
        height: 100%;
      }
      .flipbook-viewport {
        height: 100%;
      }
      .flipbook-viewport .flipbook {
        position: absolute;
        width: 461px;
        left: -230px;
      }
      .flipbook-viewport .page {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 48px;
        box-sizing: border-box;
      }
      /* 글자 위치는 그대로 두고 링크의 누르는 영역만 44px 높이로 키운다. */
      a {
        display: inline-block;
        padding: 13px 0;
        margin: -13px 0;
      }
      /* 카드(461px)보다 좁은 화면에서는 카드를 화면 폭에 맞춘다. */
      @media (max-width: 461px) {
        .flipbook-viewport .flipbook {
          width: 100vw;
          left: -50vw;
        }
        .flipbook-viewport .page {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="flipbook-viewport">
      <div class="container">
        <div class="flipbook">
          <div class="page">
            <h1>404</h1>
            <p>페이지를 찾을 수 없습니다.<br />Page not found.</p>
            <p><a href="/2024_client_MinJeong_Interaction-pages/">플립북으로 돌아가기 / Back to the flipbook</a></p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
